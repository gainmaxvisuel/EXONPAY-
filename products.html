<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXONPAY - Produits</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding-bottom: 85px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #111827;
}

.header {
    position: relative;
    overflow: hidden;
    background: #111827;
    color: white;
    padding: 22px 18px 70px;
    border-radius: 0 0 28px 28px;
}

.background-logos {
    position: absolute;
    inset: 0;
    opacity: .05;
    overflow: hidden;
    pointer-events: none;
}

.background-logos img {
    position: absolute;
    width: 110px;
    height: 110px;
    object-fit: contain;
}

.logo1 { left: 5%; top: 5px; }
.logo2 { left: 42%; top: 55px; }
.logo3 { right: 4%; top: -15px; }
.logo4 { left: 22%; bottom: -35px; }
.logo5 { right: 22%; bottom: -25px; }

.header-content {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: auto;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    border-radius: 10px;
}

.brand-name {
    font-size: 18px;
    font-weight: 800;
}

.page-title {
    margin-top: 24px;
    font-size: 24px;
    font-weight: 800;
}

.page-subtitle {
    margin-top: 7px;
    color: rgba(255,255,255,.7);
    font-size: 13px;
}

.content {
    max-width: 900px;
    margin: -35px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 5;
}

.section {
    margin-bottom: 25px;
}

.section-title {
    margin-bottom: 11px;
    font-size: 17px;
    font-weight: 800;
}

.section-description {
    margin: -5px 0 12px;
    color: #6b7280;
    font-size: 12px;
}

.products {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.product-card {
    display: flex;
    align-items: center;
    gap: 14px;

    padding: 13px;

    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;

    box-shadow: 0 5px 18px rgba(0,0,0,.05);
}

.product-image {
    flex: 0 0 105px;
    width: 105px;
    height: 105px;

    background: #f3f4f6;
    border-radius: 14px;

    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    min-width: 0;
    flex: 1;
}

.product-name {
    margin-bottom: 8px;
    font-size: 16px;
    font-weight: 800;
}

.product-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;

    margin-top: 5px;

    font-size: 12px;
}

.product-label {
    color: #6b7280;
}

.product-value {
    text-align: right;
    font-weight: 700;
}

.product-price {
    margin-top: 9px;
    font-size: 17px;
    font-weight: 800;
}

.buy-button {
    width: 100%;
    margin-top: 11px;
    padding: 11px 13px;

    border: 0;
    border-radius: 10px;

    background: #111827;
    color: white;

    font-size: 13px;
    font-weight: 800;

    cursor: pointer;
}

.buy-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.empty {
    display: none;
    padding: 20px;

    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 15px;

    text-align: center;
    color: #6b7280;
    font-size: 13px;
}

.loading {
    padding: 25px;
    text-align: center;
    color: #6b7280;
    font-size: 13px;
}

.message {
    display: none;

    position: fixed;
    z-index: 500;

    left: 16px;
    right: 16px;
    bottom: 90px;

    padding: 14px 16px;

    background: #111827;
    color: white;

    border-radius: 12px;

    text-align: center;
    font-size: 13px;
    font-weight: 700;

    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.bottom-nav {
    position: fixed;
    z-index: 100;

    left: 0;
    right: 0;
    bottom: 0;

    height: 72px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    background: rgba(255,255,255,.97);
    border-top: 1px solid #e5e7eb;

    backdrop-filter: blur(10px);
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 6px;

    color: #6b7280;

    text-decoration: none;

    font-size: 11px;
    font-weight: 700;
}

.nav-item.active {
    color: #111827;
}

.nav-icon {
    width: 20px;
    height: 20px;

    border: 1.8px solid currentColor;
    border-radius: 5px;
}

.nav-team {
    border-radius: 50%;
}

.nav-profile {
    border-radius: 50%;
}

@media (max-width: 500px) {

    .product-image {
        flex-basis: 88px;
        width: 88px;
        height: 88px;
    }

    .product-name {
        font-size: 14px;
    }

    .product-price {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="background-logos">
        <img class="logo1" src="logo.png" alt="">
        <img class="logo2" src="logo.png" alt="">
        <img class="logo3" src="logo.png" alt="">
        <img class="logo4" src="logo.png" alt="">
        <img class="logo5" src="logo.png" alt="">
    </div>

    <div class="header-content">

        <div class="brand">
            <img src="logo.png" alt="EXONPAY">
            <div class="brand-name">EXONPAY</div>
        </div>

        <div class="page-title">
            Produits
        </div>

        <div class="page-subtitle">
            Découvrez les produits disponibles
        </div>

    </div>

</header>


<main class="content">

    <div id="loading" class="loading">
        Chargement des produits...
    </div>


    <!-- SECTION 1 -->

    <section
        id="section-simple"
        class="section"
        style="display:none;"
    >

        <div class="section-title">
            Produits
        </div>

        <div class="section-description">
            Produits actuellement disponibles.
        </div>

        <div
            id="products-simple"
            class="products"
        ></div>

    </section>


    <!-- SECTION 2 -->

    <section
        id="section-opportunite"
        class="section"
        style="display:none;"
    >

        <div class="section-title">
            Opportunités
        </div>

        <div class="section-description">
            Opportunités disponibles à l'achat.
        </div>

        <div
            id="products-opportunite"
            class="products"
        ></div>

    </section>


    <!-- SECTION 3 -->

    <section
        id="section-premium"
        class="section"
        style="display:none;"
    >

        <div class="section-title">
            Premium
        </div>

        <div class="section-description">
            Produits premium disponibles.
        </div>

        <div
            id="products-premium"
            class="products"
        ></div>

    </section>

</main>


<div
    id="message"
    class="message"
></div>


<nav class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item"
    >
        <span class="nav-icon"></span>
        <span>Accueil</span>
    </a>

    <a
        href="products.html"
        class="nav-item active"
    >
        <span class="nav-icon"></span>
        <span>Produit</span>
    </a>

    <a
        href="team.html"
        class="nav-item"
    >
        <span class="nav-icon nav-team"></span>
        <span>Équipe</span>
    </a>

    <a
        href="profile.html"
        class="nav-item"
    >
        <span class="nav-icon nav-profile"></span>
        <span>Profil</span>
    </a>

</nav>


<script>

/*
=========================================================
CONFIGURATION
=========================================================
*/

const SUPABASE_URL =
    "https://euyvppbbhjrjcbgmdian.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1eXZwcGJiaGpyamNiZ21kaWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjIxNjYsImV4cCI6MjEwMzY5ODE2Nn0.BOH9ZGx5I34wzIkl8oGU7_BZ8yN3zWZSqIrBceb6aH0";


/*
=========================================================
SESSION
=========================================================
*/

const savedUser =
    localStorage.getItem("exonpay_user");

if (!savedUser) {

    window.location.replace("login.html");

}

let sessionUser;

try {

    sessionUser =
        JSON.parse(savedUser);

} catch (error) {

    localStorage.removeItem("exonpay_user");

    window.location.replace("login.html");

}


function headers() {

    return {

        "apikey":
            SUPABASE_ANON_KEY,

        "Authorization":
            "Bearer " +
            SUPABASE_ANON_KEY,

        "Content-Type":
            "application/json",

        "Accept":
            "application/json"

    };

}


/*
=========================================================
MESSAGE
=========================================================
*/

function showMessage(text) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    setTimeout(() => {

        box.style.display = "none";

    }, 4000);

}


/*
=========================================================
FORMAT FCFA
=========================================================
*/

function money(value) {

    return Number(
        value || 0
    ).toLocaleString(
        "fr-FR",
        {
            maximumFractionDigits: 0
        }
    ) + " FCFA";

}


/*
=========================================================
NORMALISATION DU TYPE
=========================================================
*/

function normalizeType(type) {

    return String(
        type || ""
    )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}


/*
=========================================================
DETERMINER LA SECTION
=========================================================
*/

function getSection(type) {

    const normalized =
        normalizeType(type);


    /*
    Produits simples
    */

    if (
        normalized === "simple" ||
        normalized === "produit" ||
        normalized === "standard"
    ) {

        return "simple";

    }


    /*
    Opportunités
    */

    if (
        normalized.includes("opportun")
    ) {

        return "opportunite";

    }


    /*
    Premium
    */

    if (
        normalized.includes("premium")
    ) {

        return "premium";

    }


    /*
    Si un nouveau type est ajouté,
    il reste dans la section Produits.
    */

    return "simple";

}


/*
=========================================================
CREATION CARTE PRODUIT
=========================================================
*/

function createProductCard(
    product,
    imageNumber
) {

    const card =
        document.createElement("article");

    card.className =
        "product-card";


    const imageBox =
        document.createElement("div");

    imageBox.className =
        "product-image";


    const image =
        document.createElement("img");

    /*
    IMAGE AUTOMATIQUE

    produit1.png
    produit2.png
    produit3.png
    ...
    */

    image.src =
        "produit" +
        imageNumber +
        ".png";

    image.alt =
        product.name || "Produit";


    /*
    Si l'image n'existe pas,
    on garde un espace propre.
    */

    image.onerror =
        function() {

            this.style.display =
                "none";

        };


    imageBox.appendChild(image);


    const info =
        document.createElement("div");

    info.className =
        "product-info";


    const name =
        document.createElement("div");

    name.className =
        "product-name";

    name.textContent =
        product.name;


    const price =
        document.createElement("div");

    price.className =
        "product-price";

    price.textContent =
        money(product.price);


    const daily =
        document.createElement("div");

    daily.className =
        "product-row";

    daily.innerHTML =

        '<span class="product-label">Revenu journalier</span>' +

        '<span class="product-value">' +
        money(product.daily_income) +
        '</span>';


    const days =
        document.createElement("div");

    days.className =
        "product-row";

    days.innerHTML =

        '<span class="product-label">Durée</span>' +

        '<span class="product-value">' +
        Number(product.cycle_days || 0) +
        ' jours</span>';


    const total =
        document.createElement("div");

    total.className =
        "product-row";

    total.innerHTML =

        '<span class="product-label">Revenu total</span>' +

        '<span class="product-value">' +
        money(product.total_income) +
        '</span>';


    const buy =
        document.createElement("button");

    buy.className =
        "buy-button";

    buy.type =
        "button";

    buy.textContent =
        "Acheter";


    buy.addEventListener(
        "click",
        () => {

            buyProduct(
                product,
                buy
            );

        }
    );


    info.appendChild(name);

    info.appendChild(price);

    info.appendChild(daily);

    info.appendChild(days);

    info.appendChild(total);

    info.appendChild(buy);


    card.appendChild(imageBox);

    card.appendChild(info);


    return card;

}


/*
=========================================================
CHARGER LES PRODUITS
=========================================================
*/

async function loadProducts() {

    const loading =
        document.getElementById(
            "loading"
        );


    try {

        const url =

            SUPABASE_URL +

            "/rest/v1/products" +

            "?select=id,name,product_type,price,daily_income,cycle_days,total_income,is_active,is_visible" +

            "&is_active=eq.true" +

            "&is_visible=eq.true" +

            "&order=created_at.asc";


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: headers()
                }
            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        const products =
            await response.json();


        loading.style.display =
            "none";


        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            return;

        }


        /*
        Compteur global des images.

        Produit 1 = produit1.png
        Produit 2 = produit2.png
        etc.
        */

        let imageNumber = 1;


        products.forEach(
            product => {

                const section =
                    getSection(
                        product.product_type
                    );


                const container =
                    document.getElementById(
                        "products-" +
                        section
                    );


                const sectionElement =
                    document.getElementById(
                        "section-" +
                        section
                    );


                if (
                    !container ||
                    !sectionElement
                ) {

                    return;

                }


                const card =
                    createProductCard(
                        product,
                        imageNumber
                    );


                container.appendChild(
                    card
                );


                /*
                La section devient visible
                uniquement lorsqu'elle contient
                un produit actif et visible.
                */

                sectionElement.style.display =
                    "block";


                imageNumber++;

            }
        );


    } catch (error) {

        console.error(
            "Erreur produits:",
            error
        );


        loading.textContent =
            "Impossible de charger les produits.";

    }

}


/*
=========================================================
ACHAT REEL
=========================================================

Appel direct de la fonction PostgreSQL :

purchase_product(
    p_user_id,
    p_product_id
)

La fonction existante retourne notamment :

- user_product_id
- product_id
- product_name
- purchase_amount
- principal_used
- withdrawal_used
- professional_transaction_id
- principal_balance
- withdrawal_balance
- buyer_spins_added
- sponsor_spins_added
- status
=========================================================
*/

async function buyProduct(
    product,
    button
) {

    const userId =
        sessionUser.user_id;


    if (!userId) {

        showMessage(
            "Session utilisateur introuvable."
        );

        return;

    }


    if (!product.id) {

        showMessage(
            "Produit invalide."
        );

        return;

    }


    const confirmation =
        window.confirm(

            "Acheter « " +
            product.name +
            " » pour " +
            money(product.price) +
            " ?"

        );


    if (!confirmation) {
        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Traitement...";


    try {

        /*
        Appel RPC Supabase vers la fonction
        PostgreSQL purchase_product.
        */

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/rpc/purchase_product",

                {

                    method: "POST",

                    headers:
                        headers(),

                    body:
                        JSON.stringify({

                            p_user_id:
                                userId,

                            p_product_id:
                                product.id

                        })

                }

            );


        const result =
            await response.json();


        if (!response.ok) {

            let errorMessage =
                "Impossible d'effectuer l'achat.";


            if (
                result &&
                result.message
            ) {

                errorMessage =
                    result.message;

            } else if (
                result &&
                result.error
            ) {

                errorMessage =
                    result.error;

            } else if (
                typeof result === "string"
            ) {

                errorMessage =
                    result;

            }


            throw new Error(
                errorMessage
            );

        }


        /*
        La fonction retourne une ligne.
        */

        const purchase =
            Array.isArray(result)
                ? result[0]
                : result;


        /*
        Succès réel confirmé par PostgreSQL.
        */

        showMessage(
            "Achat effectué avec succès."
        );


        button.textContent =
            "Acheté";


        /*
        Redirection après achat.
        */

        setTimeout(
            () => {

                window.location.href =
                    "dashboard.html";

            },
            1200
        );


    } catch (error) {

        console.error(
            "Erreur achat:",
            error
        );


        showMessage(
            error.message ||
            "Impossible d'effectuer l'achat."
        );


        button.disabled =
            false;

        button.textContent =
            "Acheter";

    }

}


/*
=========================================================
CHARGEMENT INITIAL
=========================================================
*/

loadProducts();

</script>

</body>
</html>
